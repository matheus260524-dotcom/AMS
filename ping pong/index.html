
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Ping Pong</title>
</head>

<body>

    <main>

        <!-- Bola -->
        <img
            class="bola"
            src="assets/bola .png"
            alt="Bola"
        >

        <!-- Raquete do jogador 1 -->
        <img
            class="racket"
            src="assets/racket_2_transparent.png"
            alt="Raquete do jogador 1"
        >

        <!-- Raquete do jogador 2 -->
        <img
            class="racket1"
            src="assets/racket_1_transparent.png"
            alt="Raquete do jogador 2"
        >

        <!-- Divisão do campo -->
        <img
            src="assets/branco.png"
            alt=""
            class="divisa"
        >

    </main>

    <script src="js.js"></script>

</body>
</html>
