<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Document</title>
</head>
<body>
    <h1 class="titulo">Formulario de adoção</h1>

    <form class="cor"> 
        <div class="nome">
        <label for="nome">
            <input type="text" placeholder="nome">
            Nome
        </label>
        </div>

        <div class="idade">
            <label for="idade">
                <input type="text" placeholder="Idade">
                Idade
            </label>
        </div>
        <div class="telefone">
            <input type="text" placeholder="telefone">
            Telefone
        </div>
        <div class="raca">
            <label for="raca">
               <select name="raca" id="raca">
                <option value="caramelo">Caramelo</option>
                <option value="Dalmata">Dalmata</option>
                <option value="Branco">Branco</option>
                <option value="Pelagem escuro">Pelagem escra</option>
               </select>

            </label>
        </div>

         <div class="campos">
            <h2>Você tem espaço nescessario?</h2>
           <select name="opcao" id="opcao">
            <option value="sim">Sim</option>
            <option value="Nao">Não</option>
           </select>
         </div>

         <div class="precaucao">
            <h2>Você dará todas as vacinas nescessarias ?</h2>
            <input type="text" placeholder="Digite">
         </div>

        <div class="foto" >
            <img src="images/ChatGPT Image 27 de set. de 2026, 06_15_11.png" width="250px" >
        </div>
        <div class="foto2">
            <img   src="images/ChatGPT Image 27 de set. de 2026, 06_25_47.png" width="250px">
      
        </div>
    </form>

   
</body>
</html>
